<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230b1021'/><text x='50' y='75' font-size='55' font-family='Arial, sans-serif' font-weight='900' fill='%2338bdf8' text-anchor='middle'>FC</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230b1021'/><text x='50' y='75' font-size='55' font-family='Arial, sans-serif' font-weight='900' fill='%2338bdf8' text-anchor='middle'>FC</text></svg>">
    <title>Ivan_Khmelnitsky — Электронная визитка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            background-color: #e2e8f0;
        }
        h1 {
            font-size: 26px;
            color: #1e293b;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .motto {
            color: #16a34a;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        
        /* Стили для кнопок сайтов */
        .btn.shop { background-color: #ff9f43; }
        .btn.shop:hover { background-color: #ee8f2e; }
        
        .btn.tech { background-color: #00d2d3; }
        .btn.tech:hover { background-color: #00b3b4; }
        
        /* Стили для контактов */
        .btn.whatsapp { background-color: #22c55e; }
        .btn.whatsapp:hover { background-color: #16a34a; }
        
        .btn.phone { background-color: #2563eb; }
        .btn.phone:hover { background-color: #1d4ed8; }
        
        /* Стили для почты */
        .btn.email { background-color: #64748b; }
        .btn.email:hover { background-color: #475569; }

        /* Стили для блока QR-кода */
        .qr-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px dashed #cbd5e1;
        }
        .qr-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }
        .qr-img {
            width: 180px;
            height: 180px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Фото -->
    <img src="avatar.jpg" alt="Ivan Khmelnitsky" class="profile-img" onerror="this.style.display='none'">
    
    <h1>Іван Хмельницький</h1>
    <div class="motto">E-Diabet.com</div>
    
    <div class="links">
        <!-- НАШИ САЙТЫ -->
        <a href="https://Linx.org.ua" target="_blank" class="btn shop">Online-Linx org</a>
        <a href="https://ivan-khmelnitsky.e-diabet.com" target="_blank" class="btn tech">Portfolio (Ivan Khmelnitsky)</a>
        
        <!-- СВЯЗЬ -->
        <a href="https://wa.me/380506305657" target="_blank" class="btn whatsapp">Schreibe mir auf WhatsApp</a>
        <a href="tel:+380506305657" class="btn phone">Anruf +380506305657</a>
        <a href="mailto:ivan.xmel2012@gmail.com" class="btn email">E-Mail senden</a>
    </div>

    <!-- БЛОК С ПРАВИЛЬНЫМ QR-КОДОМ -->
    <div class="qr-section">
        <div class="qr-title">Іван Хмельницький</div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://fedor-hub-uetersen.github.io/Ivan-Khmelnitsky/" alt="QR Code" class="qr-img">
    </div>
</div>

</body>
</html>
